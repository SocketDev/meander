catalog:
  '@redwoodjs/agent-ci': 0.17.1
  '@shadscan/cli': 0.5.0
  '@sinclair/typebox': 0.34.52
  '@socketregistry/packageurl-js': 1.5.0
  '@socketregistry/packageurl-js-stable': npm:@socketregistry/packageurl-js@1.5.0
  '@socketsecurity/lib': 6.5.2
  '@socketsecurity/lib-stable': npm:@socketsecurity/lib@6.5.2
  '@socketsecurity/registry': 2.0.5
  '@socketsecurity/registry-stable': npm:@socketsecurity/registry@2.0.5
  '@socketsecurity/sdk': 4.1.3
  '@socketsecurity/sdk-stable': npm:@socketsecurity/sdk@4.1.3
  '@types/mdast': 4.0.4
  '@types/node': 26.1.1
  '@types/semver': 7.7.1
  '@types/shell-quote': 1.7.5
  '@ultrathink/acorn.rs.wasm': 0.1.1
  '@vitiate/core': 0.3.1
  '@vitest/coverage-v8': 4.1.10
  '@vitest/ui': 4.1.10
  'c8': 12.0.0
  'chrome-devtools-mcp': 1.6.0
  'compromise': 14.16.0
  'dtu-github-actions': 0.17.1
  'fast-check': 4.9.0
  'lightningcss': 1.33.0
  'magic-string': 1.1.0
  'markdownlint-cli2': 0.23.1
  'mdast-util-from-markdown': 2.0.3
  'micromark': 4.0.2
  'neosanitize': 0.3.0
  'nock': 14.0.16
  'npm-high-impact': 1.13.0
  'oxfmt': 0.60.0
  'oxlint': 1.75.0
  # oxlint-tsgolint — the type-aware lint sidecar the fleet lint runner's
  # whole-tree gate invokes via `oxlint --type-aware`. Exact-pinned to match
  # the wheelhouse catalog; the per-platform binaries are soak-excluded
  # transitives (consumers depend on `oxlint-tsgolint` only).
  'oxlint-tsgolint': 7.0.2001
  'playwright-core': 1.62.0
  'portless': 0.15.4
  'regjsparser': 0.13.2
  # Fleet bundler. Single-sourced to match the wheelhouse catalog pin;
  # the hook-bundle build (scripts/fleet/build-hook-bundle.mts) runs it.
  'rolldown': 1.1.4
  'semver': 7.8.5
  'shell-quote': 1.10.0
  'taze': 19.16.0
  'typescript': 7.0.2
  # vite 8.x is rolldown-native (no esbuild transitive); the override
  # below pins every transitive vite (vitest, @vitest/*) to it.
  'vite': 8.1.5
  'vitiate': 0.3.1
  'vitest': 4.1.10

overrides:
  # Fleet-canonical overrides (managed by socket-wheelhouse sync; do not edit).
  '@socketregistry/packageurl-js': 'catalog:'
  '@socketsecurity/lib': 'catalog:'
  '@socketsecurity/registry': 'catalog:'
  '@socketsecurity/sdk': 'catalog:'
  'chalk@>=5': '5.6.2'
  'es-define-property': 'npm:@socketregistry/es-define-property@1.0.7'
  'es-set-tostringtag': 'npm:@socketregistry/es-set-tostringtag@1.0.10'
  'function-bind': 'npm:@socketregistry/function-bind@1.0.7'
  'glob': '13.0.6'
  'gopd': 'npm:@socketregistry/gopd@1.0.7'
  'has-symbols': 'npm:@socketregistry/has-symbols@1.0.7'
  'has-tostringtag': 'npm:@socketregistry/has-tostringtag@1.0.7'
  'hasown': 'npm:@socketregistry/hasown@1.0.7'
  'iconv-lite': '0.7.3'
  'isexe@>=3': '4.0.0'
  'js-yaml@>=5.0.0 <5.2.2': '5.2.2'
  'lru-cache@>=10': '11.5.2'
  'magic-string': '1.1.0'
  'mime-db': '1.54.0'
  'mime-types@>=3': '3.0.2'
  'minipass@>=4': '7.1.3'
  'safe-buffer': 'npm:@socketregistry/safe-buffer@1.0.9'
  'safer-buffer': 'npm:@socketregistry/safer-buffer@1.0.10'
  'semver@>=5.0.0 <7.6.0': '7.8.5'
  'side-channel': 'npm:@socketregistry/side-channel@1.0.10'
  'ssri@>=12': '13.0.1'
  'string-width@>=5': '8.2.2'
  'update-notifier@>=4.0.0': '7.3.1'
  'uuid': '11.1.1'
  'which': '7.0.0'
  'wrap-ansi@>=8': '9.0.2'
  'yaml@2': '2.9.0'

  # Repo-specific overrides below.
  # Dedup: @types/node 18 rides in via @anthropic-ai/sdk + @valtown/sdk and
  # drags undici-types 5 beside the 26/8 pair the tree already carries.
  # Types-only package — collapse to the catalog pin.
  '@types/node': 'catalog:'
  # Dedup: css-tree 2.2.1 via svgo's own csso dependency (its
  # minifyStyles plugin, unrelated to meander's own CSS minify
  # pass — that pass now runs on lightningcss, not csso), pinned
  # ~2.2.0, vs 3.2.1 direct from svgo. css-tree 3's AST-shape
  # breaks don't touch the surface csso exercises — functionally
  # verified at the wheelhouse: csso.minify() and a full
  # svgo.optimize() pass both produce correct output on 3.2.1.
  'css-tree': '3.2.1'
  # Force every transitive vite resolution (vitest, @vitest/*) to the
  # catalog'd rolldown-native 8.x — vite 6/7 hard-depend on esbuild.
  'rolldown': 'catalog:'
  'vite': 'catalog:'

# Register .claude/hooks/* as workspace packages so `pnpm install`
# resolves each hook's deps + taze (via `pnpm run update`) bumps
# them alongside the root manifest. Keeps hook deps in lockstep.
packages:
  - '.claude/hooks/fleet/*'
  - '.config/fleet/oxlint-plugin'
  - '.config/fleet/oxlint-plugin/fleet/*'
trustPolicy: no-downgrade
# Drop vite 8's optional esbuild peer wiring — rolldown is the bundler.
# meander carries no direct esbuild devDep at all; the opt-in minify pass
# (src/minify.mts) and the deploy-val bundle step (src/deploy-val.mts) both
# use rolldown instead.
ignoredOptionalDependencies:
  - esbuild
allowBuilds:
  # @swc/core ships a native binary + a WASM plugin cache used by the
  # vitiate coverage-guided fuzz lane's instrument transform (see the
  # root vitest.config.mts). Its postinstall must run so `pnpm run
  # test:fuzz` can SWC-instrument src/.
  '@socketsecurity/sdk': false
  '@swc/core': true
  cpu-features: false
  # puppeteer's postinstall downloads ~300MB of Chromium. meander
  # itself never renders mermaid in CI — the fixture has no
  # mermaid blocks — so skip the build script here. Consumers
  # who enable { "mermaid": true } install puppeteer as their
  # own peer dep and allow the build in their own
  # pnpm-workspace.yaml.
  protobufjs: false
  puppeteer: false
  ssh2: false
# Apply a 7-day cooldown on fresh releases (matches taze's
# maturityPeriod). Blocks install of any version published in
# the last 7 days; gives the ecosystem time to catch
# compromised uploads.
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  # `@rolldown/pluginutils` versions independently of the catalog-pinned
  # rolldown release; the per-platform bindings share its pin.
  # Listed explicitly per the fleet "no scope globs in soak excludes" rule.
  - '@rolldown/pluginutils'
  - '@sdxgen/*'
  - '@socketoverride/*'
  - '@socketregistry/*'
  - '@socketsecurity/*'
  - '@stuie/*'
  - '@ultrathink/*'
  - 'sdxgen'
  - 'sfw'
  - 'socket'
  # oxlint-tsgolint 7.0.2001 — the type-aware lint sidecar the fleet lint
  # runner's whole-tree gate needs. The main package + its per-platform binary
  # family are pinned to the exact version (a scope glob would blanket-bypass a
  # future publish); exact-pinned so a future version re-soaks.
  # taze 19.16.0 — the dep updater itself; forced ahead of the soak by owner
  # directive so the regenerated single-registry patch (patchedDependencies)
  # tracks the current release. Exact-pinned so a future version re-soaks.
  # verkit — new dev-only transitive of taze 19.16.0 (same owner directive);
  # exact-pinned so future versions re-soak.
  # js-yaml 5.2.2 — HIGH security fix, GHSA-pm4m-ph32-ghv5, Dependabot alert
  # 37; the overrides entry above forces it past markdownlint-cli2's 5.2.1
  # pin. Soak bypassed per the high-severity security exception; exact-pinned
  # so a future version re-soaks.
patchedDependencies:
  # single-registry: routes taze version resolution through its own bundled
  # registry client against the configured registry instead of npm's public
  # default. That third-party hop leaks our dependency names,
  # violates the fleet single-registry posture, and is blocked by egress
  # policy here — every lookup then hits taze's request timeout while taze
  # swallows the failure silently (the fleet update wrapper now fails
  # loud on it). The former 5s->30s timeout half of this patch retired in
  # 19.16.0: `requestTimeout` is config-wired now, set in
  # .config/fleet/taze.config.mts.
  # TEMPORARY: remove if taze grows a supported flag to force direct-registry
  # resolution (or we swap to our own metadata client, see socket-lib plan).
  taze@19.16.0: patches/taze@19.16.0.patch
blockExoticSubdeps: true
confirmModulesPurge: false
managePackageManagerVersions: false
pmOnFail: warn
